<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>休息一下</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #082018; }
  body {
    font-family: "Microsoft YaHei", sans-serif;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    color: #fff; text-align: center; user-select: none; cursor: none;
  }
  #bg {
    position: fixed; inset: 0; width: 100%; height: 100%;
    object-fit: cover; z-index: 0;
  }
  #poster {
    position: fixed; inset: 0; width: 100%; height: 100%;
    object-fit: cover; z-index: 0; display: none;
  }
  .shade {
    position: fixed; inset: 0; z-index: 1;
    background: linear-gradient(180deg, rgba(6,30,21,.30) 0%, rgba(6,30,21,.50) 100%);
  }
  .content { position: relative; z-index: 2; }
  .big {
    font-size: clamp(48px, 9vw, 100px); font-weight: 800; letter-spacing: 10px;
    text-shadow: 0 6px 30px rgba(0,0,0,.45);
  }
  .tip {
    margin-top: 24px; font-size: clamp(16px, 2vw, 22px); opacity: .95; line-height: 2;
    text-shadow: 0 2px 10px rgba(0,0,0,.5);
  }
  .count {
    margin-top: 40px; font-size: 26px; opacity: .95; font-variant-numeric: tabular-nums;
    text-shadow: 0 2px 10px rgba(0,0,0,.5);
  }
  .count .sec { font-size: 56px; font-weight: 700; margin: 0 8px; }
  .done { display: none; margin-top: 40px; font-size: 34px; font-weight: 700;
          text-shadow: 0 2px 12px rgba(0,0,0,.5); }
  .done.show { display: block; }
</style>
</head>
<body>
  <video id="bg" loop muted autoplay playsinline></video>
  <img id="poster" src="rest-bg.png" alt="">
  <div class="shade"></div>
  <div class="content">
    <div class="big" id="big">休息一下</div>
    <div class="tip" id="tip">请离开屏幕，望向 6 米以外的远处 👀<br>多眨眼 · 伸展肩颈 · 喝口水</div>
    <div class="count" id="count"><span id="countLabel">休息倒计时</span><span class="sec" id="sec">20</span><span id="unitLabel">秒</span></div>
    <div class="done" id="done">✨ 休息完成，马上回到工作</div>
  </div>

<script>
(() => {
  const q = new URLSearchParams(location.search);
  const breakSec = parseInt(q.get('break') || '20', 10);
  const lang = q.get('lang') === 'en' ? 'en' : 'zh';

  // 主题色：倒计时与完成提示用主题色的亮色变体
  const themeRaw = (q.get('theme') || '').replace(/[^0-9a-fA-F]/g, '');
  const themeHex = /^[0-9a-fA-F]{6}$/.test(themeRaw) ? themeRaw : '12644A';
  const lighten = (hex, f) => {
    const n = parseInt(hex, 16);
    const m = v => Math.round(v + (255 - v) * f);
    return 'rgb(' + m((n >> 16) & 255) + ',' + m((n >> 8) & 255) + ',' + m(n & 255) + ')';
  };
  const accent = lighten(themeHex, 0.55);

  const T = {
    zh: {
      big: '休息一下',
      tip: '请离开屏幕，望向 6 米以外的远处 👀<br>多眨眼 · 伸展肩颈 · 喝口水',
      countLabel: '休息倒计时', unit: '秒',
      done: '✨ 休息完成，马上回到工作',
      voice: 'zh-CN',
      speakRest: '休息一下，离开屏幕，看看远处，让眼睛放松一下吧',
      speakMid: '再坚持一下，记得多眨眨眼',
      speakDone: '休息完成，欢迎回来',
    },
    en: {
      big: 'Take a Break',
      tip: 'Look away from the screen at something 6 meters away 👀<br>Blink more · Stretch your neck and shoulders · Take a sip of water',
      countLabel: 'Break ends in', unit: 's',
      done: '✨ Break finished — back to work',
      voice: 'en-US',
      speakRest: 'Time for a break. Please look away from the screen and relax your eyes.',
      speakMid: 'Hang in there a little longer. Remember to blink.',
      speakDone: 'Break finished. Welcome back.',
    },
  }[lang];

  document.getElementById('big').textContent = T.big;
  document.getElementById('tip').innerHTML = T.tip;
  document.getElementById('countLabel').textContent = T.countLabel;
  document.getElementById('unitLabel').textContent = T.unit;
  document.getElementById('done').textContent = T.done;
  document.getElementById('count').style.color = accent;
  document.getElementById('done').style.color = lighten(themeHex, 0.72);
  document.title = T.big;

  // 随机选一段实拍绿植视频
  const videos = ['rest-aerial.mp4', 'rest-plant.mp4'];
  const bg = document.getElementById('bg');
  bg.src = videos[Math.floor(Math.random() * videos.length)];
  bg.play?.().catch(() => { document.getElementById('poster').style.display = 'block'; });

  // 语音：优先播放预生成的神经语音（自然、不机械）；没有文件则回退系统语音
  function speakFallback(key) {
    try {
      const text = { rest: T.speakRest, mid: T.speakMid, done: T.speakDone }[key];
      const u = new SpeechSynthesisUtterance(text);
      u.lang = T.voice; u.rate = 0.92; u.pitch = 1.03;
      const prefer = lang === 'zh'
        ? ['Xiaoxiao', 'Xiaoyi', 'Yunxi', 'Natural', 'Huihui']
        : ['Aria', 'Jenny', 'Sonia', 'Natural', 'Zira'];
      const pool = (speechSynthesis.getVoices() || []).filter(
        v => (v.lang || '').toLowerCase().slice(0, 2) === lang);
      for (const p of prefer) {
        const hit = pool.find(v => (v.name || '').includes(p));
        if (hit) { u.voice = hit; break; }
      }
      speechSynthesis.cancel();
      speechSynthesis.speak(u);
    } catch (e) {}
  }

  function speak(key) {
    try {
      const a = new Audio('voice_' + key + '_' + lang + '.mp3');
      a.volume = 0.95;
      const p = a.play();
      if (p && p.catch) p.catch(() => speakFallback(key));
    } catch (e) {
      speakFallback(key);
    }
  }

  speak('rest');

  let left = breakSec;
  const secEl = document.getElementById('sec');
  const countEl = document.getElementById('count');
  const doneEl = document.getElementById('done');
  secEl.textContent = left;

  const timer = setInterval(() => {
    left--;
    secEl.textContent = Math.max(0, left);
    if (left === Math.floor(breakSec / 2)) speak('mid');
    if (left <= 0) {
      clearInterval(timer);
      countEl.style.visibility = 'hidden';
      doneEl.classList.add('show');
      speak('done');
    }
  }, 1000);
})();
</script>
</body>
</html>
